# Nombre del proyecto en el reporte
serenity.project.name = Reto de Automatizacion - Datepicker
# Navegador por defecto: chrome | edge | firefox
# Se puede cambiar sin tocar este archivo con -Dwebdriver.driver=edge
webdriver.driver = chrome
# Ubicacion de los drivers (relativa a la raiz del proyecto).
# Cada driver debe coincidir con la version MAYOR de su navegador (Chrome 155, Edge 155).
webdriver.chrome.driver = driver/chromedriver.exe
webdriver.edge.driver = driver/msedgedriver.exe
webdriver.gecko.driver = driver/geckodriver.exe
# Abre el navegador maximizado (aplica a Edge y Firefox; Chrome usa --start-maximized)
serenity.browser.maximized = true
# Cuando tomar capturas: FOR_EACH_ACTION, AFTER_EACH_STEP, FOR_FAILURES, DISABLED
serenity.take.screenshots = FOR_EACH_ACTION
# Espera implicita en milisegundos (cuanto espera a que aparezca un elemento)
webdriver.timeouts.implicitlywait = 10000
# Argumentos con los que se abre Chrome
chrome.switches = --start-maximized,--disable-popup-blocking,--remote-allow-origins=*
